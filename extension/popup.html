<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: "Segoe UI", sans-serif; width: 260px; padding: 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  label { display: block; margin: 8px 0 4px; font-size: 12px; color: #555; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 6px; }
  button { padding: 6px 12px; cursor: pointer; width: 100%; margin-top: 10px; }
  #status { margin-top: 8px; font-size: 12px; color: #888; min-height: 14px; }
</style>
</head>
<body>
  <div class="row">
    <strong>SwissBox Catcher</strong>
    <label><input type="checkbox" id="enabled"> вкл</label>
  </div>
  <label>aria2 RPC URL</label>
  <input type="text" id="rpcUrl">
  <label>Не перехватывать мельче (МБ, 0 = все)</label>
  <input type="text" id="minSizeMb">
  <button id="save">Сохранить</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
